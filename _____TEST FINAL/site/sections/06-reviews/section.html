<section id="reviews" data-section="06-reviews" class="s-reviews" aria-labelledby="rv-title" aria-roledescription="carousel">
  <!-- One slim typographic strip: no verified review exists, so the slot is a single flagged placeholder line with
       small prev/next over three placeholder slots. No scroll motion; no blade. -->
  <div class="rv__slot">
    <p class="rv__eye"><span id="rv-title">The owners&rsquo; voice</span> <span class="rv__flag">Placeholder <i aria-hidden="true">·</i> No verified review on file</span></p>

    <div class="rv__reel" aria-live="polite">
      <figure class="rv__item is-on" data-i="0" role="group" aria-roledescription="slide" aria-label="1 of 3">
        <blockquote class="rv__quote"><p data-q>&ldquo;[Owner review, quoted verbatim: awaiting client]&rdquo;</p></blockquote>
        <figcaption class="rv__by" data-q>[Owner name] <i aria-hidden="true">·</i> [Car] <i aria-hidden="true">·</i> [Showroom] <i aria-hidden="true">·</i> [Source, date]</figcaption>
      </figure>
      <figure class="rv__item" data-i="1" role="group" aria-roledescription="slide" aria-label="2 of 3" hidden>
        <blockquote class="rv__quote"><p data-q>&ldquo;[Buyer review, quoted verbatim: awaiting client]&rdquo;</p></blockquote>

      </figure>
      <figure class="rv__item" data-i="2" role="group" aria-roledescription="slide" aria-label="3 of 3" hidden>
        <blockquote class="rv__quote"><p data-q>&ldquo;[Seller review, quoted verbatim: awaiting client]&rdquo;</p></blockquote>
        <figcaption class="rv__by" data-q>[Owner name] <i aria-hidden="true">·</i> [Car] <i aria-hidden="true">·</i> [Showroom] <i aria-hidden="true">·</i> [Source, date]</figcaption>
      </figure>
    </div>
  </div>

  <p class="rv__src">More reviews on <span class="rv__tbc">[platform and link: awaiting client]</span></p>

  <div class="rv__ctl" role="group" aria-label="Choose a review">
    <p class="rv__count" aria-hidden="true"><b data-count>01</b> / 03</p>
    <button class="rv__btn" type="button" data-prev aria-label="Previous review"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14 8H3M7 4 3 8l4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
    <button class="rv__btn" type="button" data-next aria-label="Next review"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 4l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button>
  </div>
</section>
